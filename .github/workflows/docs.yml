name: Build documentation

on:
  push:
    paths:
    - '.github/workflows/**'
    - 'docs/**'
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'docs/**'

permissions:
  contents: read

# Frequent preservation pushes on the Arena session branch must not build
# every superseded revision. Other branches retain independent runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.head_ref == 'arena/01a09f50-mame' || github.ref == 'refs/heads/arena/01a09f50-mame') && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.head_ref == 'arena/01a09f50-mame' || github.ref == 'refs/heads/arena/01a09f50-mame' }}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y librsvg2-bin latexmk python3-pip python3-sphinx texlive texlive-formats-extra texlive-science
        pip3 install sphinxcontrib-svg2pdfconverter
    - name: Build HTML
      run: make -C docs html
    - name: Build PDF
      run: make -C docs PAPER=a4 latexpdf
    - uses: actions/upload-artifact@main
      with:
        name: mame-docs-${{ github.sha }}
        path: |
          docs/build/html
          docs/build/latex/MAME.pdf
        if-no-files-found: error
