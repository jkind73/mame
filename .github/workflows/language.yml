name: Compile UI translations

on:
  push:
    paths:
    - '.github/workflows/**'
    - 'language/**'
  pull_request:
    paths:
    - '.github/workflows/**'
    - 'language/**'

permissions:
  contents: read

# Frequent preservation pushes on the Arena session branch must not build
# every superseded revision. Other branches retain independent runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ (github.head_ref == 'arena/01a09f50-mame' || github.ref == 'refs/heads/arena/01a09f50-mame') && 'latest' || github.run_id }}
  cancel-in-progress: ${{ github.head_ref == 'arena/01a09f50-mame' || github.ref == 'refs/heads/arena/01a09f50-mame' }}

jobs:
  build-language:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Compile message catalogs
      run: for x in language/*/*.po ; do python scripts/build/msgfmt.py --output-file "`dirname "$x"`/`basename "$x" .po`.mo" "$x" ; done
    - uses: actions/upload-artifact@main
      with:
        name: mame-language-${{ github.sha }}
        path: language/*/*.mo
        if-no-files-found: error
